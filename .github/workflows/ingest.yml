name: Ingest news and build feed

on:
  workflow_dispatch: {}
  # Rebuild right away when the build code or config changes, so a fix goes
  # live without waiting for the schedule.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'web/**'
      - '.github/workflows/ingest.yml'
  # Cost projection approved by Chris on 2026-10-09 (see README "Turning on
  # the schedule"). Runs every 2 hours UTC; the first step skips the rest of
  # the job outside 07:00-23:00 Europe/Madrid local time, so the cron doesn't
  # need to track daylight saving itself.
  schedule:
    # Minute 17, not 0: GitHub delays and drops on-the-hour schedules.
    - cron: '17 */2 * * *'

concurrency:
  group: ingest
  # A new run replaces one already going (runs are capped at 15 min anyway).
  cancel-in-progress: true

# id-token: write lets the job request a GitHub OIDC token, which Anthropic
# Workload Identity Federation exchanges for a short-lived API token (no
# stored API key). Set up 2026-11-06, Console rule news-app-ingest.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A healthy run takes ~2-5 min. Cap at 15 so a stuck run can't burn the
    # month's Actions minutes (Oct 2026: 40-min debug runs blew the quota).
    timeout-minutes: 15
    steps:
      - name: Skip outside Valencia waking hours
        id: gate
        run: |
          hour=$(TZ=Europe/Madrid date +%H)
          if [ "$hour" -lt 7 ] || [ "$hour" -gt 23 ]; then
            echo "Local Madrid hour is $hour, outside 07:00-23:00 -- skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore rolling data cache (embeddings, slant scores, cross-border cache)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-

      - name: Restore embedding model cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: embed-model-paraphrase-multilingual-MiniLM-L12-v2

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Run ingestion + scoring build
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 12
        env:
          # Workload Identity Federation (Console: rule news-app-ingest,
          # service account news-app-ingest, Default workspace). These IDs
          # are not secrets. The SDK reads them and exchanges the GitHub
          # token below for a short-lived Anthropic token.
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_016x3ZNRNCVXiMGJhr2Gi67x
          ANTHROPIC_ORGANIZATION_ID: 6323bd8d-930f-4c4e-bd6c-be96002850a0
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_013AGjcBrR7tKwC3ENANSvCp
          ANTHROPIC_WORKSPACE_ID: wrkspc_01C8KQ57oS3kvvYzdwk9Ehma
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc-jwt
        run: |
          # The Console rule's subject pattern must use GitHub's ID format:
          # repo:RULE-6-Studios@276355875/news-app@1410677171:ref:refs/heads/main
          # GitHub OIDC tokens expire about 5 minutes after issue, so refresh
          # the file every 4 minutes in case the first Claude call comes late.
          fetch_jwt() {
            curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_jwt
          test -s "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          ( while sleep 240; do fetch_jwt; done ) &
          npm run build

      - name: Save rolling data cache
        # always(): keep partial progress even if the build step fails, so the
        # next run picks up where this one stopped instead of starting over.
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: news-data-${{ github.run_id }}

      - name: Copy feed for the front end
        if: steps.gate.outputs.run == 'true'
        run: cp data/stories.json web/data/stories.json

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
