name: Ingest news and build feed

on:
  workflow_dispatch: {}
  # Rebuild right away when the build code or config changes, so a fix goes
  # live without waiting for the schedule.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'web/**'
      - '.github/workflows/ingest.yml'
  # Cost projection approved by Chris on 2026-10-09 (see README "Turning on
  # the schedule"). Runs every 2 hours UTC; the first step skips the rest of
  # the job outside 07:00-23:00 Europe/Madrid local time, so the cron doesn't
  # need to track daylight saving itself.
  schedule:
    # Minute 17, not 0: GitHub delays and drops on-the-hour schedules.
    - cron: '17 */2 * * *'

concurrency:
  group: ingest
  # A new run replaces one already going (runs are capped at 45 min anyway).
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A healthy run takes ~10-30 min. Fail fast instead of hanging for 6 hours.
    timeout-minutes: 45
    steps:
      - name: Skip outside Valencia waking hours
        id: gate
        run: |
          hour=$(TZ=Europe/Madrid date +%H)
          if [ "$hour" -lt 7 ] || [ "$hour" -gt 23 ]; then
            echo "Local Madrid hour is $hour, outside 07:00-23:00 -- skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore rolling data cache (embeddings, slant scores, cross-border cache)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-

      - name: Restore embedding model cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: embed-model-paraphrase-multilingual-MiniLM-L12-v2

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Run ingestion + scoring build
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run build

      - name: Save rolling data cache
        # always(): keep partial progress even if the build step fails, so the
        # next run picks up where this one stopped instead of starting over.
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: news-data-${{ github.run_id }}

      - name: Copy feed for the front end
        if: steps.gate.outputs.run == 'true'
        run: cp data/stories.json web/data/stories.json

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
